name: 功能建议
description: 提出新功能、改进现有行为或补充文档
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先说明**要解决的问题**，再谈具体方案 —— 这样更容易找到更合适的实现路径。
  - type: input
    id: project
    attributes:
      label: 项目
      description: 相关仓库名（在目标仓库内提 issue 可跳过）
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么困难？现有行为哪里不够用？
      placeholder: 我在做……时，必须……，很不方便 / 做不到
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 你希望它如何工作？有接口或用法示例更好
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你试过哪些绕行办法？为什么不够好？
  - type: dropdown
    id: breaking
    attributes:
      label: 是否可能引入破坏性变更
      description: 本组织允许破坏性变更，但需要显式声明
      options:
        - 不确定
        - 不会
        - 可能
        - 会
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 相关论文、其他实现的参考、性能目标等
