# Rust 起步 CI —— 四门禁
#
# 与 fq-compressor-rust 的既有实践保持一致：fmt / clippy / test / doc。
# 注意 `cargo test --lib --tests` 刻意排除 benches：criterion 的 harness = false
# 会让 `--all-targets` 真的跑完整压测，CI 上会挂很久。
name: CI

on:
  push:
    branches: [$default-branch]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test / doc (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: cargo test --lib --tests --locked

      - name: 文档构建
        run: cargo doc --no-deps --locked
